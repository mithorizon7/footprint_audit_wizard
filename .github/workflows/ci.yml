name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Verify Pinned Hosting Runtime
        run: |
          bash -n script/runtime-exec.sh
          bash script/runtime-exec.sh node --version

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: i18n Lint
        run: npm run lint:i18n

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Production HTTP Security Smoke
        run: node scripts/security-smoke.mjs
